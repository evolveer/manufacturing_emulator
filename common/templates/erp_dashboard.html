<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ERP Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Manufacturing Emulator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/erp">ERP</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/mes">MES</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pcs">PCS</a>
                        
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/monitoring">Monitoring</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>ERP Dashboard</h1>
        <p>Enterprise Resource Planning System</p>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Materials</h5>
                    </div>
                    <div class="card-body">
                        <div id="materials-list">Loading materials...</div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Products</h5>
                    </div>
                    <div class="card-body">
                        <div id="products-list">Loading products...</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header">
                        <h5>Production Plans</h5>
                    </div>
                    <div class="card-body">
                        <div id="plans-list">Loading production plans...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Fetch materials
        fetch('/api/erp/materials') 
            .then(response => response.json())
            .then(data => {
                const materialsList = document.getElementById('materials-list');
                if (data.length === 0) {
                    materialsList.innerHTML = '<p>No materials found</p>';
                    return;
                }
                
                let html = '<table class="table table-striped">';
                html += '<thead><tr><th>ID</th><th>Name</th><th>Quantity</th><th>Unit</th></tr></thead>';
                html += '<tbody>';
                
                data.forEach(material => {
                    html += `<tr>
                        <td>${material.id}</td>
                        <td>${material.name}</td>
                        <td>${material.quantity}</td>
                        <td>${material.unit}</td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                materialsList.innerHTML = html;
            })
            .catch(error => {
                document.getElementById('materials-list').innerHTML = '<p>Error loading materials</p>';
                console.error('Error:', error);
            });
            
        // Fetch products
        fetch('/api/erp/products')
            .then(response => response.json())
            .then(data => {
                const productsList = document.getElementById('products-list');
                if (data.length === 0) {
                    productsList.innerHTML = '<p>No products found</p>';
                    return;
                }
                
                let html = '<table class="table table-striped">';
                html += '<thead><tr><th>ID</th><th>Name</th><th>Description</th></tr></thead>';
                html += '<tbody>';
                
                data.forEach(product => {
                    html += `<tr>
                        <td>${product.id}</td>
                        <td>${product.name}</td>
                        <td>${product.description || ''}</td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                productsList.innerHTML = html;
            })
            .catch(error => {
                document.getElementById('products-list').innerHTML = '<p>Error loading products</p>';
                console.error('Error:', error);
            });
            
        // Fetch production plans
        fetch('/api/erp/production-plans')
            .then(response => response.json())
            .then(data => {
                const plansList = document.getElementById('plans-list');
                if (data.length === 0) {
                    plansList.innerHTML = '<p>No production plans found</p>';
                    return;
                }
                
                let html = '<table class="table table-striped">';
                html += '<thead><tr><th>ID</th><th>Product</th><th>Quantity</th><th>Status</th><th>Due Date</th></tr></thead>';
                html += '<tbody>';
                
                data.forEach(plan => {
                    const dueDate = new Date(plan.due_date).toLocaleDateString();
                    html += `<tr>
                        <td>${plan.id}</td>
                        <td>${plan.product_name || plan.product_id}</td>
                        <td>${plan.completed_quantity || 0} / ${plan.quantity}</td>
                        <td>${plan.status}</td>
                        <td>${dueDate}</td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                plansList.innerHTML = html;
            })
            .catch(error => {
                document.getElementById('plans-list').innerHTML = '<p>Error loading production plans</p>';
                console.error('Error:', error);
            });
    </script>
</body>
</html>
