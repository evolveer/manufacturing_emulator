<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MES Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">Manufacturing Emulator</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">

                    
                     <li class="nav-item">
                        <a class="nav-link active" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/erp">ERP</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/mes">MES</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/pcs">PCS</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/monitoring">Monitoring</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/order-workflow">Order Workflow</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>MES Dashboard</h1>
        <p>Manufacturing Execution System</p>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Work Orders</h5>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="hideCompletedToggle">
                            <label class="form-check-label" for="hideCompletedToggle">Hide completed</label>
                        </div>
                    </div>
                    <div class="card-body">
                        <div id="work-orders-list">Loading work orders...</div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Machines</h5>
                    </div>
                    <div class="card-body">
                        <div id="machines-list">Loading machines...</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Production Schedule</h5>
                    </div>
                    <div class="card-body">
                        <div id="schedule-list">Loading schedule...</div>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5>Quality Checks</h5>
                    </div>
                    <div class="card-body">
                        <div id="quality-list">Loading quality checks...</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Load work orders at start
        let hideCompleted = false;
        let machinesCache = [];

        document.addEventListener('DOMContentLoaded', () => {
            loadMachines(); // loads machine list and caches machines
            loadWorkOrders();
            document.getElementById('hideCompletedToggle').addEventListener('change', (e) => {
                hideCompleted = e.target.checked;
                loadWorkOrders();
            });
        });

        function getMachineSelection(workOrderId) {
            const sel = document.getElementById(`wo-machine-${workOrderId}`);
            if (!sel) return null;
            const val = sel.value;
            return val ? parseInt(val) : null;
        }

        function loadWorkOrders() {
            fetch('/api/mes/work-orders')
                .then(response => response.json())
                .then(data => {
                    const workOrdersList = document.getElementById('work-orders-list');
                    if (!Array.isArray(data) || data.length === 0) {
                        workOrdersList.innerHTML = '<p>No work orders found</p>';
                        return;
                    }
                    
                    const filtered = hideCompleted ? data.filter(w => w.status !== 'completed') : data;
                    if (filtered.length === 0) {
                        workOrdersList.innerHTML = '<p>No work orders found</p>';
                        return;
                    }
                    
                    let html = '<table class="table table-striped">';
                    html += '<thead><tr><th>ID</th><th>Product</th><th>Quantity</th><th>Status</th><th>Machine</th><th>Actions</th></tr></thead>';
                    html += '<tbody>';
                    
                    filtered.forEach(workOrder => {
                        const status = (workOrder.status || '').toLowerCase();
                        const needsPlanning = !status || !['planned', 'in_progress', 'completed', 'cancelled'].includes(status);
                        const canStart = status === 'planned';
                        const disabled = ['in_progress', 'completed', 'cancelled'].includes(status);

                        let actionLabel = 'Start';
                        let nextStatus = 'in_progress';
                        if (needsPlanning) {
                            actionLabel = 'Plan';
                            nextStatus = 'planned';
                        }

                        const machineOptions = machinesCache.map(m => `<option value="${m.id}" ${workOrder.machine_id === m.id ? 'selected' : ''}>${m.name || 'Machine'} ${m.id}</option>`).join('');
                        const machineCell = workOrder.machine_id
                            ? workOrder.machine_id
                            : (machinesCache.length
                                ? `<select class="form-select form-select-sm" id="wo-machine-${workOrder.id}">${machineOptions}</select>`
                                : 'Not assigned');

                        const machineArg = workOrder.machine_id ? workOrder.machine_id : `getMachineSelection(${workOrder.id})`;

                        html += `<tr>
                            <td>${workOrder.id}</td>
                            <td>${workOrder.product_name || workOrder.product_id}</td>
                            <td>${workOrder.completed_quantity || 0} / ${workOrder.quantity}</td>
                            <td>${workOrder.status || '-'}</td>
                            <td>${machineCell}</td>
                            <td>
                                <button class="btn btn-sm btn-primary" onclick="updateWorkOrderStatus(${workOrder.id}, '${nextStatus}', ${machineArg})" ${disabled ? 'disabled' : ''}>
                                    ${actionLabel}
                                </button>
                            </td>
                        </tr>`;
                    });
                    
                    html += '</tbody></table>';
                    workOrdersList.innerHTML = html;
                })
                .catch(error => {
                    document.getElementById('work-orders-list').innerHTML = '<p>Error loading work orders</p>';
                    console.error('Error:', error);
                });
        }

        async function updateWorkOrderStatus(workOrderId, status, machineId) {
            try {
                const response = await fetch(`/api/mes/work-orders/${workOrderId}/status`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ status })
                });
                if (!response.ok) throw new Error('Failed to update work order');

                // Require machine assignment for planning/starting
                if ((status === 'planned' || status === 'in_progress') && !machineId) {
                    alert('Assign a machine to this work order before continuing.');
                    await loadWorkOrders();
                    return;
                }

                // Kick off PCS when moving to in_progress
                if (status === 'in_progress') {
                    const pcsResp = await fetch(`/api/pcs/machines/${machineId}/start`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ work_order_id: workOrderId })
                    });
                    if (!pcsResp.ok) {
                        const errText = await pcsResp.text();
                        throw new Error(`PCS start failed: ${errText || pcsResp.statusText}`);
                    }
                }
                await loadWorkOrders();
            } catch (err) {
                alert(err.message);
                console.error('Error updating work order:', err);
            }
        }
            
        // Fetch machines (also cache for work-order selection)
        function loadMachines() {
            fetch('/api/mes/machines')
                .then(response => response.json())
                .then(data => {
                    machinesCache = Array.isArray(data) ? data : [];
                    const machinesList = document.getElementById('machines-list');
                    if (machinesCache.length === 0) {
                        machinesList.innerHTML = '<p>No machines found</p>';
                        return;
                    }
                    
                    let html = '<table class="table table-striped">';
                    html += '<thead><tr><th>ID</th><th>Name</th><th>Type</th><th>Status</th><th>Location</th></tr></thead>';
                    html += '<tbody>';
                    
                    machinesCache.forEach(machine => {
                        html += `<tr>
                            <td>${machine.id}</td>
                            <td>${machine.name}</td>
                            <td>${machine.type}</td>
                            <td>${machine.status}</td>
                            <td>${machine.location || ''}</td>
                        </tr>`;
                    });
                    
                    html += '</tbody></table>';
                    machinesList.innerHTML = html;
                })
                .catch(error => {
                    document.getElementById('machines-list').innerHTML = '<p>Error loading machines</p>';
                    console.error('Error:', error);
                });
        }
            
        // Fetch schedule
        fetch('/api/mes/schedule')
            .then(response => response.json())
            .then(data => {
                const scheduleList = document.getElementById('schedule-list');
                if (!Array.isArray(data) || data.length === 0) {
                    scheduleList.innerHTML = '<p>No schedule entries found</p>';
                    return;
                }
                
                const safeDate = (d) => {
                    if (!d) return '-';
                    const parsed = new Date(d);
                    return isNaN(parsed) ? '-' : parsed.toLocaleString();
                };
                
                const safeStatus = (s) => s || '-';
                
                let html = '<table class="table table-striped">';
                html += '<thead><tr><th>Machine</th><th>Work Order</th><th>Start Time</th><th>End Time</th><th>Status</th></tr></thead>';
                html += '<tbody>';
                
                data.forEach(entry => {
                    const startTime = safeDate(entry.start_time);
                    const endTime = safeDate(entry.end_time);
                    html += `<tr>
                        <td>${entry.machine_id ?? '-'}</td>
                        <td>${entry.work_order_id ?? '-'}</td>
                        <td>${startTime}</td>
                        <td>${endTime}</td>
                        <td>${safeStatus(entry.status)}</td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                scheduleList.innerHTML = html;
            })
            .catch(error => {
                document.getElementById('schedule-list').innerHTML = '<p>Error loading schedule</p>';
                console.error('Error:', error);
            });
            
        // Fetch quality checks
        fetch('/api/mes/quality-checks')
            .then(response => response.json())
            .then(data => {
                const qualityList = document.getElementById('quality-list');
                if (data.length === 0) {
                    qualityList.innerHTML = '<p>No quality checks found</p>';
                    return;
                }
                
                let html = '<table class="table table-striped">';
                html += '<thead><tr><th>ID</th><th>Work Order</th><th>Parameter</th><th>Value</th><th>Result</th></tr></thead>';
                html += '<tbody>';
                
                data.forEach(check => {
                    let resultClass = '';
                    if (check.result === 'pass') {
                        resultClass = 'text-success';
                    } else if (check.result === 'fail') {
                        resultClass = 'text-danger';
                    } else if (check.result === 'warning') {
                        resultClass = 'text-warning';
                    }
                    
                    html += `<tr>
                        <td>${check.id}</td>
                        <td>${check.work_order_id}</td>
                        <td>${check.parameter}</td>
                        <td>${check.value} ${check.unit || ''}</td>
                        <td class="${resultClass}">${check.result}</td>
                    </tr>`;
                });
                
                html += '</tbody></table>';
                qualityList.innerHTML = html;
            })
            .catch(error => {
                document.getElementById('quality-list').innerHTML = '<p>Error loading quality checks</p>';
                console.error('Error:', error);
            });
    </script>
</body>
</html>
